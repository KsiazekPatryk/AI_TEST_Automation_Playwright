name: Playwright CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'CI/CD']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Validate test environment
        env:
          API_URL: ${{ vars.API_URL }}
          UI_URL: ${{ vars.UI_URL }}
        run: |
          test -n "$API_URL" || { echo "::error::Set repository variable API_URL to a dedicated test API"; exit 1; }
          test -n "$UI_URL" || { echo "::error::Set repository variable UI_URL to a dedicated test UI"; exit 1; }

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run API, UI, and E2E tests
        run: npm run test:all
        env:
          API_URL: ${{ vars.API_URL }}
          UI_URL: ${{ vars.UI_URL }}
          OPENAPI_SPEC: docs/openapi/bookstoreapi.openapi.json
          LOGGER: 'false'

      - name: Upload Playwright and observability reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-reports-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            .observability/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  publish-report:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.PUBLISH_REPORT == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set up GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Download Playwright report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: playwright-reports-${{ github.run_id }}
          path: downloaded-reports

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: downloaded-reports/playwright-report

      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
