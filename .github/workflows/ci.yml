name: Playwright CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run API, UI, and E2E tests
        run: npm run test:all
        env:
          API_URL: ${{ vars.API_URL || 'https://bookstoreapi.up.railway.app' }}
          UI_URL: ${{ vars.UI_URL || 'https://ksiegarnia.up.railway.app' }}
          OPENAPI_SPEC: docs/openapi/bookstoreapi.openapi.json
          LOGGER: 'false'

      - name: Upload Playwright and observability reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-reports-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            .observability/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore